<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" font-family="Manrope,Helvetica,Arial,sans-serif"><rect width="1000" height="280" fill="#ffffff"/><text x="30" y="40" font-size="22" font-weight="800" fill="#171816">Coordinated contact cooldown</text><text x="30" y="62" font-size="12" fill="#667">Illustrative timeline with sample Pro.</text><rect x="30.0" y="110" width="290.6666666666667" height="90" rx="10" fill="#f3f0e9" stroke="#171816" stroke-width="1.5"/><text x="175.33333333333334" y="151.0" text-anchor="middle" font-size="16" font-weight="700" fill="#171816">Day 0</text><text x="175.33333333333334" y="171.0" text-anchor="middle" font-size="12" fill="#445">Team A contacts Pro</text><line x1="324.6666666666667" y1="155" x2="348.6666666666667" y2="155" stroke="#171816" stroke-width="2"/><polygon points="354.6666666666667,155 345.6666666666667,150 345.6666666666667,160" fill="#171816"/><rect x="354.6666666666667" y="110" width="290.6666666666667" height="90" rx="10" fill="#f3f0e9" stroke="#171816" stroke-width="1.5"/><text x="500.0" y="151.0" text-anchor="middle" font-size="16" font-weight="700" fill="#171816">Days 1–29</text><text x="500.0" y="171.0" text-anchor="middle" font-size="12" fill="#445">Pro is resting for all teams</text><line x1="649.3333333333334" y1="155" x2="673.3333333333334" y2="155" stroke="#171816" stroke-width="2"/><polygon points="679.3333333333334,155 670.3333333333334,150 670.3333333333334,160" fill="#171816"/><rect x="679.3333333333334" y="110" width="290.6666666666667" height="90" rx="10" fill="#f3f0e9" stroke="#171816" stroke-width="1.5"/><text x="824.6666666666667" y="151.0" text-anchor="middle" font-size="16" font-weight="700" fill="#171816">Day 30</text><text x="824.6666666666667" y="171.0" text-anchor="middle" font-size="12" fill="#445">Pro is available again</text><text x="30" y="250" font-size="12" fill="#667">30-day rest was a design decision reported in project notes; show as 'example rule'.</text></svg>