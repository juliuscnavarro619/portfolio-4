<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Performance creative learning loop</title>
  <desc id="desc">A five-stage flow from a visible performance signal through interpretation, a testable hypothesis, a structured brief, and human-reviewed production.</desc>
  <rect width="1200" height="560" fill="#fbfaf7"/>
  <text x="72" y="78" fill="#a43820" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="3">THE LEARNING LOOP</text>
  <text x="72" y="137" fill="#171816" font-family="Georgia, serif" font-size="44">Keep the signal connected to the creative decision.</text>
  <g transform="translate(72 210)">
    <g>
      <rect width="176" height="230" fill="#f3f0e9" stroke="#c8c4bb"/>
      <text x="24" y="40" fill="#a43820" font-family="Arial, sans-serif" font-size="13" font-weight="700">SEE</text>
      <text x="24" y="94" fill="#171816" font-family="Georgia, serif" font-size="28">Creative +</text>
      <text x="24" y="127" fill="#171816" font-family="Georgia, serif" font-size="28">signal</text>
      <text x="24" y="176" fill="#67665f" font-family="Arial, sans-serif" font-size="15">Play the asset beside</text>
      <text x="24" y="198" fill="#67665f" font-family="Arial, sans-serif" font-size="15">its relevant context.</text>
    </g>
    <path d="M184 115h30m-9-9 9 9-9 9" fill="none" stroke="#e45c36" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(226)">
      <rect width="176" height="230" fill="#bac7b5" stroke="#8e9b89"/>
      <text x="24" y="40" fill="#171816" font-family="Arial, sans-serif" font-size="13" font-weight="700">READ</text>
      <text x="24" y="94" fill="#171816" font-family="Georgia, serif" font-size="28">Interpret in</text>
      <text x="24" y="127" fill="#171816" font-family="Georgia, serif" font-size="28">context</text>
      <text x="24" y="176" fill="#353731" font-family="Arial, sans-serif" font-size="15">Explain meaning,</text>
      <text x="24" y="198" fill="#353731" font-family="Arial, sans-serif" font-size="15">inference, and limits.</text>
    </g>
    <path d="M410 115h30m-9-9 9 9-9 9" fill="none" stroke="#e45c36" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(452)">
      <rect width="176" height="230" fill="#f3f0e9" stroke="#c8c4bb"/>
      <text x="24" y="40" fill="#a43820" font-family="Arial, sans-serif" font-size="13" font-weight="700">TEST</text>
      <text x="24" y="94" fill="#171816" font-family="Georgia, serif" font-size="28">Form a</text>
      <text x="24" y="127" fill="#171816" font-family="Georgia, serif" font-size="28">hypothesis</text>
      <text x="24" y="176" fill="#67665f" font-family="Arial, sans-serif" font-size="15">Choose what to try,</text>
      <text x="24" y="198" fill="#67665f" font-family="Arial, sans-serif" font-size="15">not what to promise.</text>
    </g>
    <path d="M636 115h30m-9-9 9 9-9 9" fill="none" stroke="#e45c36" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(678)">
      <rect width="176" height="230" fill="#171816" stroke="#171816"/>
      <text x="24" y="40" fill="#f18a69" font-family="Arial, sans-serif" font-size="13" font-weight="700">BRIEF</text>
      <text x="24" y="94" fill="#fbfaf7" font-family="Georgia, serif" font-size="28">Structure the</text>
      <text x="24" y="127" fill="#fbfaf7" font-family="Georgia, serif" font-size="28">handoff</text>
      <text x="24" y="176" fill="#b8b7b1" font-family="Arial, sans-serif" font-size="15">Objective, audience,</text>
      <text x="24" y="198" fill="#b8b7b1" font-family="Arial, sans-serif" font-size="15">hook, formats, review.</text>
    </g>
    <path d="M862 115h30m-9-9 9 9-9 9" fill="none" stroke="#e45c36" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(904)">
      <rect width="176" height="230" fill="#e45c36" stroke="#a43820"/>
      <text x="24" y="40" fill="#171816" font-family="Arial, sans-serif" font-size="13" font-weight="700">MAKE</text>
      <text x="24" y="94" fill="#171816" font-family="Georgia, serif" font-size="28">Draft +</text>
      <text x="24" y="127" fill="#171816" font-family="Georgia, serif" font-size="28">review</text>
      <text x="24" y="176" fill="#3a211a" font-family="Arial, sans-serif" font-size="15">AI assists repeatable</text>
      <text x="24" y="198" fill="#3a211a" font-family="Arial, sans-serif" font-size="15">steps; people approve.</text>
    </g>
  </g>
</svg>
