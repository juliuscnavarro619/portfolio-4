<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Creative operations flow</title>
  <desc id="desc">A five-stage flow from incoming demand to a guided brief, prioritization and resourcing, production and review, then delivery and learning.</desc>
  <rect width="1200" height="560" fill="#fbfaf7"/>
  <text x="72" y="78" fill="#a43820" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="3">THE OPERATING SYSTEM</text>
  <text x="72" y="137" fill="#171816" font-family="Georgia, serif" font-size="44">Make demand visible. Improve it before handoff.</text>
  <g transform="translate(72 210)">
    <g>
      <rect width="176" height="230" fill="#f3f0e9" stroke="#c8c4bb"/>
      <text x="24" y="40" fill="#a43820" font-family="Arial, sans-serif" font-size="13" font-weight="700">DEMAND</text>
      <text x="24" y="94" fill="#171816" font-family="Georgia, serif" font-size="28">One front</text>
      <text x="24" y="127" fill="#171816" font-family="Georgia, serif" font-size="28">door</text>
      <text x="24" y="176" fill="#67665f" font-family="Arial, sans-serif" font-size="15">Requests enter a</text>
      <text x="24" y="198" fill="#67665f" font-family="Arial, sans-serif" font-size="15">shared system.</text>
    </g>
    <path d="M184 115h30m-9-9 9 9-9 9" fill="none" stroke="#e45c36" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(226)">
      <rect width="176" height="230" fill="#bac7b5" stroke="#8e9b89"/>
      <text x="24" y="40" fill="#171816" font-family="Arial, sans-serif" font-size="13" font-weight="700">CLARIFY</text>
      <text x="24" y="94" fill="#171816" font-family="Georgia, serif" font-size="28">Guided</text>
      <text x="24" y="127" fill="#171816" font-family="Georgia, serif" font-size="28">brief</text>
      <text x="24" y="176" fill="#353731" font-family="Arial, sans-serif" font-size="15">Goal, audience,</text>
      <text x="24" y="198" fill="#353731" font-family="Arial, sans-serif" font-size="15">measure, context.</text>
    </g>
    <path d="M410 115h30m-9-9 9 9-9 9" fill="none" stroke="#e45c36" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(452)">
      <rect width="176" height="230" fill="#f3f0e9" stroke="#c8c4bb"/>
      <text x="24" y="40" fill="#a43820" font-family="Arial, sans-serif" font-size="13" font-weight="700">DECIDE</text>
      <text x="24" y="94" fill="#171816" font-family="Georgia, serif" font-size="28">Prioritize &amp;</text>
      <text x="24" y="127" fill="#171816" font-family="Georgia, serif" font-size="28">resource</text>
      <text x="24" y="176" fill="#67665f" font-family="Arial, sans-serif" font-size="15">Lane, owner, hours,</text>
      <text x="24" y="198" fill="#67665f" font-family="Arial, sans-serif" font-size="15">timing, tradeoffs.</text>
    </g>
    <path d="M636 115h30m-9-9 9 9-9 9" fill="none" stroke="#e45c36" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(678)">
      <rect width="176" height="230" fill="#171816" stroke="#171816"/>
      <text x="24" y="40" fill="#f18a69" font-family="Arial, sans-serif" font-size="13" font-weight="700">MAKE</text>
      <text x="24" y="94" fill="#fbfaf7" font-family="Georgia, serif" font-size="28">Create &amp;</text>
      <text x="24" y="127" fill="#fbfaf7" font-family="Georgia, serif" font-size="28">review</text>
      <text x="24" y="176" fill="#b8b7b1" font-family="Arial, sans-serif" font-size="15">Craft, pre-check,</text>
      <text x="24" y="198" fill="#b8b7b1" font-family="Arial, sans-serif" font-size="15">human approval.</text>
    </g>
    <path d="M862 115h30m-9-9 9 9-9 9" fill="none" stroke="#e45c36" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(904)">
      <rect width="176" height="230" fill="#e45c36" stroke="#a43820"/>
      <text x="24" y="40" fill="#171816" font-family="Arial, sans-serif" font-size="13" font-weight="700">LEARN</text>
      <text x="24" y="94" fill="#171816" font-family="Georgia, serif" font-size="28">Deliver &amp;</text>
      <text x="24" y="127" fill="#171816" font-family="Georgia, serif" font-size="28">improve</text>
      <text x="24" y="176" fill="#3a211a" font-family="Arial, sans-serif" font-size="15">Close the loop and</text>
      <text x="24" y="198" fill="#3a211a" font-family="Arial, sans-serif" font-size="15">feed the next cycle.</text>
    </g>
  </g>
</svg>
